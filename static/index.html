<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIPHALE</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <button id="themeToggle">Dark Mode</button>

    <div class="container">
        <aside class="sidebar">
            <h3>Settings</h3>

            <label for="provider">Provider:</label>
            <select id="provider">
                <option value="">default</option>
                <option value="openrouter">openrouter</option>
                <option value="local">local (Ollama)</option>
                <option value="groq">groq</option>
                <option value="huggingface">huggingface</option>
            </select>

            <label for="model">Model (optional):</label>
            <input id="model" placeholder="e.g. qwen2.5-coder:7b">

            <label for="useRag">
                <input type="checkbox" id="useRag"> USE RAG
            </label>

            <div id="ragSection" style="display: none;">
                <label for="ragSource">RAG Source:</label>
                <select id="ragSource">
                    <option value="">Select a source...</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <h1>GIPHALE</h1>
            <form id="aiForm">
                <label for="prompt">Prompt:</label>
                <textarea id="prompt" required>Hola, ¿cómo estás?</textarea>
                <button type="submit">Send</button>
            </form>

            <div id="response">Respuesta aparecerá aquí...</div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
